# Builds the static site and publishes it to GitHub Pages.
# Campaign closed: the counter is frozen at the final figure committed in
# public/data/contador.json. To restart it, bring back the schedule and the
# "Actualizar contador de correos" step (see git history).
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # On launch day, set the repo variable REDIRIGIR_A to the new address:
      # this copy then only redirects there and keeps serving the counter file.
      - name: Redirigir a la nueva dirección (si está configurada)
        run: node scripts/redirigir.mjs
        env:
          REDIRIGIR_A: ${{ vars.REDIRIGIR_A }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
