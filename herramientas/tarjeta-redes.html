<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Decreto Mari Carmen · Redes</title>
<!-- Generador de las imágenes para redes. Ábrelo en el navegador con ?f=square (1080×1080),
     ?f=vertical (1080×1350) o ?f=horizontal (1200×675), y opcionalmente &url=tudominio.org/campana,
     y haz una captura del tamaño indicado. public/compartir.png es la versión horizontal. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;700&display=swap" />
<style>
  :root { --ink: #14201b; --paper: #f2f4ef; --accent: #c1421a; --accent-ink: #fff6ee; --salmon: #f3b79f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ink); }
  body { width: var(--w); height: var(--h); overflow: hidden; }
  .card { position: relative; width: var(--w); height: var(--h); background: var(--ink); color: var(--paper); overflow: hidden; display: flex; flex-direction: column; }

  .franja { background: var(--accent); color: var(--accent-ink); font: 600 calc(var(--u) * 1.55) 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; padding: calc(var(--u) * 1.5) var(--pad); display: flex; gap: calc(var(--u) * 2.2); white-space: nowrap; }
  .franja span + span::before { content: '■'; margin-right: calc(var(--u) * 2.2); font-size: 0.6em; vertical-align: 0.2em; }

  .body { flex: 1; display: flex; flex-direction: column; padding: calc(var(--u) * 5) var(--pad) calc(var(--u) * 4); min-height: 0; }
  .claim { font: 600 calc(var(--u) * 3.1) 'IBM Plex Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--salmon); }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: calc(var(--u) * var(--title)); line-height: 0.98; letter-spacing: -0.015em; margin-top: calc(var(--u) * 2.4); }
  h1 em { font-style: italic; font-weight: 600; color: var(--ink); background: var(--paper); padding: 0 0.1em; line-height: 1.16; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

  .hemi { flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; margin-top: calc(var(--u) * 2.5); }
  .hemi svg { height: 100%; max-width: 100%; }

  .pie { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3); padding-top: calc(var(--u) * 2.2); border-top: 2px solid rgba(242,244,239,0.28); }
  .cta { font: 700 calc(var(--u) * 2.25) 'IBM Plex Sans', sans-serif; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--paper); box-shadow: calc(var(--u) * 0.5) calc(var(--u) * 0.5) 0 var(--paper); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.8); white-space: nowrap; }
  .url { font: 600 calc(var(--u) * 2.7) 'IBM Plex Mono', monospace; color: var(--paper); text-align: right; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; }

  /* Horizontal: text left, hemicycle right. */
  .h .body { display: grid; grid-template-columns: 1.15fr 0.85fr; grid-template-rows: auto 1fr auto; column-gap: calc(var(--u) * 3); }
  .h .claim { grid-column: 1; grid-row: 1; }
  .h h1 { grid-column: 1; grid-row: 2; align-self: center; margin-top: 0; }
  .h .hemi { grid-column: 2; grid-row: 1 / 3; margin-top: 0; align-items: center; }
  .h .hemi svg { width: 100%; height: auto; }
  .h .pie { grid-column: 1 / 3; grid-row: 3; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="franja"><span>Pleno extraordinario</span><span>Viernes 2 de octubre · 11:00</span><span class="extra">Congreso</span></div>
  <div class="body">
    <p class="claim">350 caras. Una votación.</p>
    <h1>Que no dejen caer el <em>Decreto Mari Carmen</em></h1>
    <div class="hemi"><svg viewBox="0 0 400 206" aria-hidden="true"><g id="seats"></g></svg></div>
    <div class="pie">
      <span class="cta">Escribe a tus diputados</span>
      <span class="url" id="url"></span>
    </div>
  </div>
</div>
<script>
  // Format from the query string: square (1080×1080), vertical (1080×1350), horizontal (1200×675).
  var formatos = {
    square:     { w: 1080, h: 1080, u: 10.8, pad: 76, title: 10.4 },
    vertical:   { w: 1080, h: 1350, u: 10.8, pad: 76, title: 11.2 },
    horizontal: { w: 1200, h: 675,  u: 8.4,  pad: 60, title: 11.4, h2: true },
  };
  // ?f=square|vertical|horizontal  &url=dominio.org/campana  (the address shown
  // at the bottom right; leave it out to show none).
  var params = new URLSearchParams(location.search);
  var f = formatos[params.get('f')] || formatos.square;
  var url = (params.get('url') || '').trim();
  var huecoUrl = document.getElementById('url');
  if (url) {
    huecoUrl.textContent = url;
  } else {
    huecoUrl.remove();
  }
  var root = document.documentElement.style;
  root.setProperty('--w', f.w + 'px'); root.setProperty('--h', f.h + 'px');
  root.setProperty('--u', f.u + 'px'); root.setProperty('--pad', f.pad + 'px'); root.setProperty('--title', f.title);
  if (f.h2) document.getElementById('card').classList.add('h');

  // Same parliament-arch layout and group colours as the website.
  var groups = [['#d8323a',121],['#d9437f',26],['#f0ae1d',7],['#9dc32a',6],['#9aa39d',9],['#2e7a45',5],['#2bb3a6',7],['#1f7fc7',137],['#5aae2e',32]];
  var total = 350, rows = 12, inner = 0.38, R = 190, cx = 200, cy = 198, radii = [], sum = 0, i, j;
  for (i = 0; i < rows; i++) { radii.push(inner + (1 - inner) * i / (rows - 1)); sum += radii[i]; }
  var counts = radii.map(function (r) { return Math.floor(total * r / sum); });
  var left = total - counts.reduce(function (a, b) { return a + b; }, 0);
  for (i = rows - 1; left > 0; i = (i - 1 + rows) % rows, left--) counts[i]++;
  var seats = [];
  radii.forEach(function (r, k) { var n = counts[k]; for (j = 0; j < n; j++) { var a = Math.PI * (1 - j / (n - 1)); seats.push({ x: cx + R * r * Math.cos(a), y: cy - R * r * Math.sin(a), a: a, r: r }); } });
  seats.sort(function (p, q) { return q.a - p.a || p.r - q.r; });
  var s = 0, sr = (R * (1 - inner) / (rows - 1)) * 0.42, html = '';
  groups.forEach(function (gr) { for (var k = 0; k < gr[1]; k++, s++) html += '<circle cx="' + seats[s].x.toFixed(1) + '" cy="' + seats[s].y.toFixed(1) + '" r="' + sr.toFixed(2) + '" fill="' + gr[0] + '" stroke="#14201b" stroke-width="0.7"/>'; });
  document.getElementById('seats').innerHTML = html;
</script>
</body>
</html>
